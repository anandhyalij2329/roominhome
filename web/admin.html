<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — RoomInHome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-page">
  <header class="site-nav">
    <div class="container inner">
      <a class="brand" href="/">Room<span>InHome</span></a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="container admin-wrap">
    <div class="page-hero admin-hero">
      <div>
        <h1>Admin</h1>
        <p class="muted">Site overview — new listings, registrations, and full property control.</p>
      </div>
      <button type="button" class="btn btn-ghost" id="refresh-btn">Refresh</button>
    </div>

    <section class="admin-stats" id="stats" aria-label="Overview"></section>

    <div class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab is-active" data-tab="properties">Properties</button>
      <button type="button" class="admin-tab" data-tab="users">Users</button>
    </div>

    <section class="admin-panel is-active" id="tab-properties">
      <div class="admin-toolbar">
        <div class="admin-filters">
          <button type="button" class="chip is-active" data-type="">All</button>
          <button type="button" class="chip" data-type="room">Room</button>
          <button type="button" class="chip" data-type="home">Home</button>
          <button type="button" class="chip" data-type="pg">PG</button>
          <button type="button" class="chip" data-type="shop">Shop</button>
        </div>
        <input type="search" id="prop-search" placeholder="Search title, city, phone…" />
      </div>
      <div id="prop-list" class="admin-table-wrap"></div>
    </section>

    <section class="admin-panel" id="tab-users" hidden>
      <div class="admin-toolbar">
        <div class="admin-filters">
          <button type="button" class="chip is-active" data-role="">All</button>
          <button type="button" class="chip" data-role="owner">Owners</button>
          <button type="button" class="chip" data-role="seeker">Seekers</button>
          <button type="button" class="chip" data-role="admin">Admins</button>
        </div>
      </div>
      <div id="user-list" class="admin-table-wrap"></div>
    </section>

    <div id="admin-msg"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
