<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join — RoomInHome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-nav">
    <div class="container inner">
      <a class="brand" href="/">Room<span>InHome</span></a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>
  <main class="auth-wrap">
    <div class="panel auth-panel stack">
      <h1>Join RoomInHome</h1>
      <p class="muted">Owners list properties. Seekers find and book them.</p>
      <form id="reg-form" class="stack">
        <label>Name <input name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
        <label>Phone <input name="phone" placeholder="10-digit mobile" /></label>
        <label>Password <input type="password" name="password" required minlength="6" /></label>
        <label>I am a
          <select name="role" id="role">
            <option value="seeker">Seeker (looking to rent)</option>
            <option value="owner">Owner (listing property)</option>
          </select>
        </label>
        <button class="btn btn-primary" type="submit">Create account</button>
        <div id="msg"></div>
      </form>
      <p class="muted">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    renderNav();
    const role = new URLSearchParams(location.search).get("role");
    if (role === "owner" || role === "seeker") document.getElementById("role").value = role;
    document.getElementById("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById("msg");
      try {
        const data = await api("/api/auth/register", {
          method: "POST",
          body: JSON.stringify({
            name: fd.get("name"),
            email: fd.get("email"),
            phone: fd.get("phone"),
            password: fd.get("password"),
            role: fd.get("role"),
          }),
        });
        setSession(data.token, data.user);
        location.href = data.user.role === "owner" ? "/owner.html" : "/listings.html?type=room";
      } catch (err) {
        msg.className = "alert";
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
